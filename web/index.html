<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lapdiff</title>
  </head>
  <body>
    <header>
      <nav class="tabs">
        <a href="#overview" data-view="overview">全体</a>
        <a href="#corner" data-view="corner">コーナー</a>
      </nav>
      <div class="controls">
        <label id="course-label">コース <select id="course"></select></label>
        <label>基準ラップ <select id="ref"></select></label>
        <label id="cmp-label">比較 <select id="cmp"></select></label>
        <label><input type="checkbox" id="multi" /> 複数の周を重ねる</label>
        <label><input type="checkbox" id="show-invalid" /> 無効な周も出す</label>
      </div>
    </header>
    <div id="error" hidden></div>
    <main id="view-overview">
      <section class="map-col">
        <div id="map"></div>
        <div id="map-legend"></div>
      </section>
      <section class="dist-col">
        <aside id="sections-panel" class="loss-panel" hidden>
          <div class="fp-head" id="sp-head">
            <span id="sp-title"></span>
            <button type="button" id="sp-toggle" aria-controls="sp-body">たたむ</button>
          </div>
          <div class="fp-body" id="sp-body"></div>
        </aside>
        <div class="dist-main">
          <div id="legend" class="legend"></div>
          <div id="speed"></div>
          <div id="dt"></div>
          <div class="g-row">
            <div id="gg"></div>
            <div id="readout"></div>
          </div>
        </div>
      </section>
    </main>
    <main id="view-corner" hidden>
      <section class="cmap-col">
        <div id="c-map"></div>
      </section>
      <section class="dist-col">
        <div class="corner-bar" id="corner-bar"></div>
        <h2 id="c-title"></h2>
        <div id="c-legend" class="legend"></div>
        <div id="c-offset"></div>
        <div id="c-speed"></div>
        <div id="c-ax"></div>
        <div id="c-pedal"></div>
        <div class="g-row">
          <div id="c-gg"></div>
          <div class="table-scroll"><table id="c-table" class="stats"></table></div>
        </div>
      </section>
    </main>
    <section>
      <table id="laps"></table>
    </section>
    <footer>
      <p class="note" id="attribution" hidden></p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
