# コーナーの区間（基準線上の距離 [m]）。ingest.corners が候補を書き、人が直す。
# source = okayama_lap10_best.csv、lap 10（131.468 s、有効な周の最速）
# s_apex, r_apex は参考値：その周の走行ラインで |kappa| が最大の点と、そこでの曲率半径 [m]
# （正が左、負が右）。区間の決め方は ingest/corners.py の docstring にある
#
# name は手で付けた。周回の順とコーナーの向き・速さから当てた通称で、コース図では確かめていない。
# 確信のないものに「（仮）」を付けた。T5 と T6 は同じ左で、間で曲率がいったん抜け、
# それぞれにブレーキがあるので分けた。2 つで 1 つのリボルバーとみている。
#
# 候補にしなかった緩い曲がり（半径 150〜400 m。全開で抜ける）：
#   s_apex = 754, r_apex = 230
#   s_apex = 877, r_apex = -251
#   （754 の左と 877 の右の切り返しをモスS（仮）とみている）
#   s_apex = 2291, r_apex = -350

